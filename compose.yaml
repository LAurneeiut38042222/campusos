name: campusos-python

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: campusos
      MYSQL_USER: campusos
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Setează MYSQL_PASSWORD în .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" --password=\"$$MYSQL_PASSWORD\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build: .
    environment:
      MYSQL_HOST: db
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Setează MYSQL_PASSWORD în .env}
      SECRET_KEY: ${SECRET_KEY:?Setează SECRET_KEY în .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@campusos.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Setează ADMIN_PASSWORD în .env}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
