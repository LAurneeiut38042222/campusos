{% extends "base.html" %}
{% block title %}Editează orarul | CampusOS{% endblock %}
{% block content %}
    <section class="form-panel">
        <h1>{{ 'Editează ora' if entry_id else 'Adaugă o oră' }}</h1>
        <p>Ora apare săptămânal în orarul comun.</p>
        <form class="fields" method="post">
            <input type="hidden" name="csrf" value="{{ csrf }}">
            <label>Materie
                <input name="title" value="{{ entry.title }}" maxlength="100" required>
            </label>
            <label>Tipul activității
                <select name="kind">
                    {% for value, label in class_types.items() %}
                        <option value="{{ value }}"{% if entry.kind == value %} selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </label>
            <label>Ziua
                <select name="weekday">
                    {% for label in days %}
                        <option value="{{ loop.index0 }}"{% if entry.weekday|string == loop.index0|string %} selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </label>
            <div class="two-fields">
                <label>Ora de început
                    <input type="time" name="starts_at" value="{{ entry.starts_at|ora_text }}" required>
                </label>
                <label>Ora de final
                    <input type="time" name="ends_at" value="{{ entry.ends_at|ora_text }}" required>
                </label>
            </div>
            <label>Sală (opțional)
                <input name="room" value="{{ entry.room }}" maxlength="60">
            </label>
            <div class="actions">
                <button>Salvează</button>
                <a href="{{ url_for('schedule') }}">Înapoi la orar</a>
            </div>
        </form>
    </section>
{% endblock %}
